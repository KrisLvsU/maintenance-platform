name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: maintenance_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 143143
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maintenance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/maintenance_db
      DB_USERNAME: postgres
      DB_PASSWORD: 143143

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package