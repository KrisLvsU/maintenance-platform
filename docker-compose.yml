services:

  postgres:
    image: postgres:18

    container_name: maintenance-postgres

    environment:
      POSTGRES_DB: maintenance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintenance_db"]
      interval: 5s
      timeout: 5s
      retries: 10


  maintenance-platform:
    build: .

    container_name: maintenance-platform

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/maintenance_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: